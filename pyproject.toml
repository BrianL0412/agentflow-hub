[project]
name = "agentflow-hub"
version = "0.1.0"
description = "A durable, multi-agent execution control plane for ticket DAGs."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentflow = "agentflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentflow*"]
